<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Job Application for Software Engineering Intern at Fake Company</title>
</head>
<body>
  <h1>Software Engineering Intern</h1>
  <form id="application-form">
    <label for="first_name">First Name *</label>
    <input id="first_name" name="first_name" required>

    <label for="last_name">Last Name *</label>
    <input id="last_name" name="last_name" required>

    <label for="email">Email *</label>
    <input id="email" name="email" required>

    <label for="country">Country *</label>
    <select id="country" name="country" required>
      <option value="">Select...</option>
      <option>Canada</option>
      <option>United States</option>
    </select>

    <label for="phone">Phone</label>
    <input id="phone" name="phone">

    <label for="resume">Resume/CV *</label>
    <input id="resume" name="resume" type="file" required>

    <label for="question_2001">LinkedIn Profile</label>
    <input id="question_2001" name="question_2001">

    <label for="question_2002">Will you now or in the future require visa sponsorship to work in the United States? *</label>
    <select id="question_2002" name="question_2002" required>
      <option value="">Select...</option>
      <option value="1">Yes</option>
      <option value="0">No</option>
    </select>

    <label for="question_2003">How did you hear about this job?</label>
    <input id="question_2003" name="question_2003">

    <label for="question_2004">Why do you want to work here? *</label>
    <textarea id="question_2004" name="question_2004" required></textarea>

    <label for="question_2005">Anything else we should know?</label>
    <textarea id="question_2005" name="question_2005"></textarea>

    <button type="submit">Submit application</button>
  </form>
  <script>
    // Test-only variants, picked with the page's query string:
    //   ?confirm_ms=N  the thank-you page shows up N ms after Submit
    //   ?code=1        Submit asks for an emailed verification code in one box, like Greenhouse
    //                  can; Verify (or confirm_ms running out) shows the thank-you page
    //   ?code=boxes    like Greenhouse's job boards: Submit adds 8 one-character code boxes
    //                  (security-input-0..7) to the form, and Submit again sends the code
    // A code of all zeros is wrong: the page says so and keeps asking.
    const params = new URLSearchParams(location.search);
    const thanks = () => {
      document.body.innerHTML = "<h1>Thank you for applying to Fake Company!</h1>";
    };
    const wrong = code => /^0+$/.test(code);
    const prompt = "A verification code was sent to you@example.com. Enter the 8-character " +
      "code to confirm you're a human.";
    const showError = () => {
      if (!document.getElementById("code-error")) {
        document.getElementById("code-prompt").insertAdjacentHTML(
          "afterend", '<p id="code-error">Incorrect security code. Please try again.</p>');
      }
    };
    const form = document.getElementById("application-form");
    form.addEventListener("submit", event => {
      event.preventDefault();
      if (params.get("code") === "boxes") {
        const boxes = [...document.querySelectorAll("[id^=security-input-]")];
        if (!boxes.length) {
          const inputs = [...Array(8).keys()].map(i =>
            `<input id="security-input-${i}" maxlength="1" aria-label="Security code character ${i + 1}">`);
          form.querySelector("button[type=submit]").insertAdjacentHTML(
            "beforebegin", `<p id="code-prompt">${prompt}</p>${inputs.join("")}`);
          return;
        }
        const code = boxes.map(box => box.value).join("");
        if (code.length === 8 && !wrong(code)) {
          thanks();
        } else {
          showError();
        }
        return;
      }
      if (params.has("code")) {
        document.body.innerHTML =
          `<p id="code-prompt">${prompt}</p>` +
          '<input id="security-code" aria-label="Security code">' +
          '<button id="verify" type="button">Verify</button>';
        document.getElementById("verify").addEventListener("click", () => {
          if (wrong(document.getElementById("security-code").value)) {
            showError();
          } else {
            thanks();
          }
        });
      } else if (params.has("confirm_ms")) {
        document.body.innerHTML = "<p>Sending your application...</p>";
      } else {
        thanks();
      }
      if (params.has("confirm_ms")) {
        setTimeout(thanks, Number(params.get("confirm_ms")));
      }
    });
  </script>
</body>
</html>
